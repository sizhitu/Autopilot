# Render 部署配置：后端 FastAPI（位于 trading_tool/）
# 在 Render 控制台「New → Web Service → 连接 GitHub 仓库」后，
# 选择本文件即可自动识别；也可在控制台手动填写下方对应项。
services:
  - type: web
    name: autopilot-api
    runtime: python
    rootDir: trading_tool        # 代码与依赖都在 trading_tool 目录
    plan: free                   # 免费额度；注意免费版会休眠（首次访问有冷启动）
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # ===== Supabase（认证 + 唯一业务数据库）=====
      # 在 Supabase 控制台 Project Settings → API 中获取；并在 SQL Editor 执行
      # ../supabase/migrations/0001_init.sql 建立表与 RLS。
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 用于后端校验前端传来的 JWT（Project Settings → API → JWT Secret）
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ===== 本地开发回退（仅未配置 SUPABASE_URL 时使用 SQLite）=====
      - key: DATABASE_PATH
        value: /tmp/autopilot.db

      # ===== 缓存层 =====
      # 早期可留空，自动回退到 Postgres `cache` 表；后期接入 Upstash Redis：
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ===== 应用邮件（EDM / 客服工单，走 Resend API）=====
      # 认证邮件（验证码 / Magic Link）在 Supabase 后台把 Auth 邮件绑定到 Resend。
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        value: support@timebricks.bid
      - key: SITE_NAME
        value: Autopilot 投资分析

      # ===== 跨域 / 管理员 =====
      - key: CORS_ORIGINS
        value: "https://timebricks.bid,https://autopilot.pages.dev"
      # 额外授予管理员权限的邮箱（逗号分隔）
      - key: ADMIN_EMAILS
        sync: false

      # ===== AI 周报 / 月报（OpenAI 兼容接口，可选）=====
      # 未配置 AI_API_KEY 时报告降级为结构化纯文本 HTML，不中断主流程。
      # 可对接 OpenAI / DeepSeek / 通义千问 / 智谱 GLM / 本地 vLLM（改 AI_BASE_URL）。
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: REPORT_MAX_SYMBOLS
        value: "15"

      # ===== 多设备实时同步（默认关）=====
      - key: ENABLE_REALTIME
        value: "false"
