name: Weekly watchlist digest

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore weekly throttle and resend now (true = test new template)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger digest API
        env:
          API_BASE: ${{ secrets.DIGEST_API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secrets: DIGEST_API_BASE and/or CRON_SECRET"
            exit 1
          fi
          BASE="${API_BASE%/}"
          FORCE_Q="false"
          if [ "${FORCE}" = "true" ]; then FORCE_Q="true"; fi
          URL="${BASE}/api/cron/reports?period=weekly&force=${FORCE_Q}"
          echo "Calling ${URL}"
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --max-time 180 \
              "${URL}" || true)
            echo "Attempt $i → HTTP $code"
            cat /tmp/resp.json || true
            echo
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 25
          done
          if [ "$ok" != "1" ]; then
            echo "Digest trigger failed"
            exit 1
          fi
