name: Supabase weekly cold backup

on:
  schedule:
    # Sunday 02:00 UTC = Sunday 10:00 China time
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-weekly-cold-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_RECIPIENT: ${{ vars.SUPABASE_BACKUP_AGE_RECIPIENT }}
      GH_TOKEN: ${{ github.token }}
      BACKUP_RETENTION_DAYS: "30"
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_DB_URL" ]] || { echo "::error::Missing Actions secret SUPABASE_DB_URL"; exit 1; }
          [[ -n "$AGE_RECIPIENT" ]] || { echo "::error::Missing Actions variable SUPABASE_BACKUP_AGE_RECIPIENT"; exit 1; }
          [[ "$AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]] || { echo "::error::SUPABASE_BACKUP_AGE_RECIPIENT is not a valid age public recipient"; exit 1; }

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age zstd postgresql-client jq

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Export Supabase database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-backup"
          cd "$RUNNER_TEMP/supabase-backup"

          # Supabase CLI intentionally filters managed/internal schemas.
          # Keep roles, schema and data as separate portable SQL dumps.
          supabase db dump --remote="$SUPABASE_DB_URL" -f roles.sql --role-only
          supabase db dump --remote="$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --remote="$SUPABASE_DB_URL" -f data.sql --data-only --use-copy \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

          for file in roles.sql schema.sql data.sql; do
            test -s "$file" || { echo "::error::Backup output is missing or empty: $file"; exit 1; }
          done

          SERVER_VERSION="$(psql "$SUPABASE_DB_URL" -X -A -t -c 'SHOW server_version' | tr -d '\r')"
          cat > manifest.json <<EOF
          {
            "format": "supabase-cli-logical-dump",
            "created_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "postgres_server_version": "$SERVER_VERSION",
            "files": ["roles.sql", "schema.sql", "data.sql"],
            "retention_days": 30,
            "includes": ["database roles", "schema", "database data", "RLS policies", "database functions and triggers where supported by Supabase CLI"],
            "excludes": ["Supabase Storage object bytes", "project-level Auth/OAuth/SMTP settings", "Edge Function source and secrets"],
            "notes": ["Storage metadata may be filtered with Supabase-managed schemas; actual Storage objects are not included.", "The data dump may contain auth user PII and password hashes; keep this archive encrypted and private."]
          }
          EOF

          sha256sum roles.sql schema.sql data.sql manifest.json > SHA256SUMS
          sha256sum --check SHA256SUMS

          # Validate the compressed archive can be listed and extracted before encryption/upload.
          tar --zstd -cf database-backup.tar.zst roles.sql schema.sql data.sql manifest.json SHA256SUMS
          tar --zstd -tf database-backup.tar.zst >/dev/null
          zstd -t database-backup.tar.zst

          age -r "$AGE_RECIPIENT" -o database-backup.tar.zst.age database-backup.tar.zst
          test -s database-backup.tar.zst.age
          SIZE_BYTES="$(stat -c%s database-backup.tar.zst.age)"
          echo "Encrypted backup size: $SIZE_BYTES bytes"
          if (( SIZE_BYTES > 1900000000 )); then
            echo "::error::Backup exceeds the 1.9 GB safety limit for a single GitHub Release asset."
            exit 1
          fi

          echo "BACKUP_DIR=$RUNNER_TEMP/supabase-backup" >> "$GITHUB_ENV"
          echo "BACKUP_TAG=supabase-db-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - name: Verify restore in an isolated local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          RESTORE_DIR="$RUNNER_TEMP/restore-check"
          mkdir -p "$RESTORE_DIR"
          supabase init --workdir "$RESTORE_DIR"
          supabase db start --workdir "$RESTORE_DIR"

          cd "$BACKUP_DIR"
          psql \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file roles.sql \
            --file schema.sql \
            --command 'SET session_replication_role = replica' \
            --file data.sql \
            --dbname 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'

      - name: Publish encrypted backup and prune expired releases
        shell: bash
        run: |
          set -euo pipefail
          cd "$BACKUP_DIR"

          cat > release-notes.md <<EOF
          Automated encrypted Supabase logical database backup.
          Created: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Retention: 30 days
          Format: Supabase CLI roles/schema/data SQL, zstd-compressed and age-encrypted.
          Storage object bytes and project-level settings are not included.
          EOF

          gh release create "$BACKUP_TAG" database-backup.tar.zst.age \
            --title "$BACKUP_TAG" \
            --notes-file release-notes.md

          # Confirm the release asset exists before deleting any older backup.
          gh release view "$BACKUP_TAG" --json assets | \
            jq -e '.assets[] | select(.name == "database-backup.tar.zst.age" and .size > 0)' >/dev/null

          CUTOFF_EPOCH="$(date -u -d "$BACKUP_RETENTION_DAYS days ago" +%s)"
          gh release list --limit 100 --json tagName,publishedAt | \
            jq -r '.[] | select(.tagName | startswith("supabase-db-")) | [.tagName, .publishedAt] | @tsv' | \
            while IFS=$'\t' read -r tag published_at; do
              [[ -n "$tag" && -n "$published_at" ]] || continue
              PUBLISHED_EPOCH="$(date -u -d "$published_at" +%s)"
              if (( PUBLISHED_EPOCH < CUTOFF_EPOCH )); then
                echo "Deleting expired backup release: $tag ($published_at)"
                gh release delete "$tag" --yes --cleanup-tag
              fi
            done

          echo "Backup published: $BACKUP_TAG"
