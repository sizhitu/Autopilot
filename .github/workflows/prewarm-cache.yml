name: Prewarm quote cache after market close

# 流程：先唤醒并验证 /api/health=200，再请求 prewarm（避免冷启动 502/503）
# A股：UTC 08/10/12/14；美股：UTC 22/00/02/04
on:
  schedule:
    - cron: "0 8,10,12,14 * * 1-5"
    - cron: "0 22,0,2,4 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "预热市场 us / cn / all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - us
          - cn
      limit:
        description: "每轮最多预热标的数（建议 30–60）"
        required: false
        default: "40"

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wake, verify health, then prewarm
        env:
          API_BASE: ${{ secrets.DIGEST_API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MARKET: ${{ github.event.inputs.market || '' }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secrets: DIGEST_API_BASE and/or CRON_SECRET"
            exit 1
          fi
          BASE="${API_BASE%/}"
          HOUR=$(date -u +%H)
          if [ -n "${MARKET}" ]; then
            MKT="${MARKET}"
          elif echo "08 10 12 14" | grep -qw "${HOUR}"; then
            MKT="cn"
          elif echo "22 00 02 04" | grep -qw "${HOUR}"; then
            MKT="us"
          else
            MKT="all"
          fi

          wake_and_verify() {
            echo "=== Wake & verify ${BASE}/api/health ==="
            local ok=0
            local w
            for w in 1 2 3 4 5 6 7 8; do
              hc=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 45 "${BASE}/api/health" || true)
              echo "health attempt $w → HTTP $hc"
              if [ "$hc" = "200" ]; then
                # 再确认一次，避免刚醒立刻抖动
                sleep 5
                hc2=$(curl -sS -o /tmp/health2.json -w "%{http_code}" --max-time 30 "${BASE}/api/health" || true)
                echo "health confirm → HTTP $hc2"
                if [ "$hc2" = "200" ]; then
                  ok=1
                  break
                fi
              fi
              sleep $((15 + w * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "Health check failed: instance not ready"
              return 1
            fi
            echo "Health OK — proceed to prewarm"
            return 0
          }

          if ! wake_and_verify; then
            # 定时任务：实例长期起不来则 soft-fail；手动触发仍失败
            if [ -n "${MARKET}" ]; then
              exit 1
            fi
            echo "Scheduled run: soft-fail (health not ready)"
            exit 0
          fi

          URL="${BASE}/api/cron/prewarm-cache?market=${MKT}&limit=${LIMIT}"
          echo "=== Calling ${URL} ==="

          last_stale=99
          for round in 1 2 3 4; do
            # 每轮开始前再确认一次健康
            if ! wake_and_verify; then
              echo "Lost health before round $round"
              if [ -n "${MARKET}" ]; then exit 1; fi
              exit 0
            fi

            ok=0
            for i in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/prewarm.json -w "%{http_code}" \
                -X POST \
                -H "X-Cron-Secret: ${CRON_SECRET}" \
                -H "Content-Type: application/json" \
                --max-time 120 \
                "${URL}" || true)
              echo "Round $round attempt $i → HTTP $code"
              cat /tmp/prewarm.json 2>/dev/null || true
              echo
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              echo "Non-200 — re-wake then retry"
              wake_and_verify || true
              sleep $((20 + i * 10))
            done

            if [ "$ok" != "1" ]; then
              echo "Prewarm HTTP failed after health-verified retries"
              if [ -n "${MARKET}" ]; then exit 1; fi
              echo "Scheduled run: soft-fail"
              exit 0
            fi

            STALE=$(python3 -c "import json;d=json.load(open('/tmp/prewarm.json'));print(int(d.get('stale') or 0))" 2>/dev/null || echo 99)
            last_stale=$STALE
            echo "stale_count=$STALE"
            if [ "$STALE" = "0" ]; then
              echo "All symbols fresh"
              exit 0
            fi
            if [ "$round" -lt 4 ]; then
              echo "Still stale, sleep 60s..."
              sleep 60
            fi
          done
          echo "Finished with remaining stale=$last_stale (next schedule will continue)"
