name: Prewarm quote cache after market close

# 盘后每 2 小时拉一次，直到接口回报 stale≈0 或达到轮次上限
# A股：UTC 08/10/12/14（约 CST 16–22 点）
# 美股：UTC 22/00/02/04（约 ET 收盘后）
on:
  schedule:
    - cron: "0 8,10,12,14 * * 1-5"
    - cron: "0 22,0,2,4 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "预热市场 us / cn / all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - us
          - cn
      limit:
        description: "最多预热标的数"
        required: false
        default: "200"

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Trigger prewarm until fresh
        env:
          API_BASE: ${{ secrets.DIGEST_API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MARKET: ${{ github.event.inputs.market || '' }}
          LIMIT: ${{ github.event.inputs.limit || '200' }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secrets: DIGEST_API_BASE and/or CRON_SECRET"
            exit 1
          fi
          BASE="${API_BASE%/}"
          HOUR=$(date -u +%H)
          if [ -n "${MARKET}" ]; then
            MKT="${MARKET}"
          elif echo "08 10 12 14" | grep -qw "${HOUR}"; then
            MKT="cn"
          elif echo "22 00 02 04" | grep -qw "${HOUR}"; then
            MKT="us"
          else
            MKT="all"
          fi
          URL="${BASE}/api/cron/prewarm-cache?market=${MKT}&limit=${LIMIT}"
          echo "Calling ${URL}"
          # 同一 job 内最多 3 轮，间隔 90s，直到 stale=0
          for round in 1 2 3; do
            ok=0
            for i in 1 2 3; do
              code=$(curl -sS -o /tmp/prewarm.json -w "%{http_code}" \
                -X POST \
                -H "X-Cron-Secret: ${CRON_SECRET}" \
                -H "Content-Type: application/json" \
                --max-time 300 \
                "${URL}" || true)
              echo "Round $round attempt $i → HTTP $code"
              cat /tmp/prewarm.json || true
              echo
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              sleep 15
            done
            if [ "$ok" != "1" ]; then
              echo "Prewarm HTTP failed"
              exit 1
            fi
            STALE=$(python3 -c "import json;d=json.load(open('/tmp/prewarm.json'));print(int(d.get('stale') or 0))" 2>/dev/null || echo 99)
            echo "stale_count=$STALE"
            if [ "$STALE" = "0" ]; then
              echo "All symbols fresh"
              exit 0
            fi
            if [ "$round" -lt 3 ]; then
              echo "Still stale, sleep 90s and retry..."
              sleep 90
            fi
          done
          echo "Finished with remaining stale (will retry next 2h schedule)"
