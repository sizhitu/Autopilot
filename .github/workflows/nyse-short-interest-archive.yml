name: NYSE consolidated short-interest archive

on:
  # NYSE reports are released twice monthly, but holidays/weekends shift dates.
  # Poll each US business day after the usual 4:00 p.m. ET dissemination window;
  # the job only commits when a new or revised official XLS report appears.
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "重新下载并解析已归档报告"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Autopilot code
        uses: actions/checkout@v4
        with:
          path: app

      - name: Validate cold-backup token
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::缺少 DATA_REPO_TOKEN，无法写入私有 Autopilot-data。"
            exit 1
          fi

      - name: Checkout cold backup
        uses: actions/checkout@v4
        with:
          repository: sizhitu/Autopilot-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependencies
        run: pip install -q pandas pyarrow xlrd==2.0.1

      - name: Download and parse official reports
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python app/scripts/archive/nyse_short_interest/fetch_and_parse.py \
            --out data-repo/data $FORCE

      - name: Commit to cold backup
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nyse_short_interest
          if git diff --staged --quiet; then
            echo "No new NYSE consolidated short-interest reports."
          else
            git commit -m "data(nyse-si): archive official aggregate reports $(date -u +%Y-%m-%d)"
            git push
          fi
