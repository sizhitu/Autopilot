name: Crowding persistence regression tests

on:
  pull_request:
    paths:
      - "trading_tool/cache.py"
      - "trading_tool/watchlist.py"
      - "trading_tool/web_app.py"
      - "trading_tool/market_temperature.py"
      - "supabase/migrations/0009_market_temperature.sql"
      - "scripts/archive/archive_market_temperature.py"
      - "tests/test_market_temperature.py"
      - "trading_tool/strategy_engine.py"
      - "tests/test_fibonacci_bearish.py"
      - "tests/test_fibonacci_history.py"
      - "tests/test_fibonacci_swing.py"
      - "tests/test_quote_performance.py"
      - "supabase/migrations/0008_crowding_persistence.sql"
      - "scripts/archive/archive_position_advice.py"
      - "scripts/archive/build_watchlist_snapshot.py"
      - "frontend/index.html"
      - "tests/test_crowding.py"
      - "tests/test_watchlist_refresh_regression.py"
      - "tests/test_analysis_ui_cleanup.py"
      - ".github/workflows/crowding-persistence-tests.yml"

jobs:
  crowding-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile trading_tool/cache.py trading_tool/watchlist.py trading_tool/web_app.py trading_tool/strategy_engine.py scripts/archive/archive_position_advice.py scripts/archive/build_watchlist_snapshot.py
      - name: Run persistence and fallback regression tests
        run: |
          PYTHONPATH=trading_tool python -m pytest tests/test_crowding.py -q -k "watchlist_restores_persisted_crowding or position_advice_persists_raw_short_metrics"
          python -m pytest tests/test_watchlist_refresh_regression.py -q
          python -m pytest tests/test_analysis_ui_cleanup.py -q
          python -m pytest tests/test_fibonacci_bearish.py -q
          python -m pytest tests/test_fibonacci_history.py -q
          python -m pytest tests/test_fibonacci_swing.py -q
          python -m pytest tests/test_quote_performance.py -q
