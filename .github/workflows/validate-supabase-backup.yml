name: Validate Supabase backup workflow

on:
  pull_request:
    paths:
      - ".github/workflows/supabase-cold-backup.yml"
      - ".github/workflows/validate-supabase-backup.yml"
      - "scripts/verify_supabase_restore.py"
      - "tests/test_backup_restore_verifier.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-cold-backup.yml"
      - ".github/workflows/validate-supabase-backup.yml"
      - "scripts/verify_supabase_restore.py"
      - "tests/test_backup_restore_verifier.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow syntax
        uses: rhysd/actionlint@v1
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]' pytest
      - name: Test COPY dump row-count parser
        run: python -m pytest -q tests/test_backup_restore_verifier.py
