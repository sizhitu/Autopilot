name: Daily watchlist snapshot

# 批算看板 JSON，写入 Autopilot-data + 本仓 frontend/snapshots，供 API 不可用时降级展示
on:
  schedule:
    # 美东收盘后 & A 股收盘后（UTC）
    - cron: "30 21 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Autopilot
        uses: actions/checkout@v4
        with:
          path: app
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Autopilot-data
        uses: actions/checkout@v4
        with:
          repository: sizhitu/Autopilot-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -q -r app/trading_tool/requirements.txt
          pip install -q pyarrow

      - name: Symbols file
        run: |
          if [ -f data-repo/symbols.txt ]; then
            cp data-repo/symbols.txt /tmp/symbols.txt
          else
            cp app/scripts/archive/symbols.default.txt /tmp/symbols.txt
          fi
          echo "--- symbols ---"
          head -50 /tmp/symbols.txt

      - name: Build watchlist_latest.json
        working-directory: app
        env:
          # 批算不依赖 Supabase
          DATABASE_PATH: /tmp/autopilot_snap.db
        run: |
          PYTHONPATH=trading_tool python scripts/archive/build_watchlist_snapshot.py \
            --out /tmp/watchlist_latest.json \
            --symbols-file /tmp/symbols.txt \
            --limit 40 \
            --sleep 0.4
          wc -c /tmp/watchlist_latest.json
          python -c "import json;d=json.load(open('/tmp/watchlist_latest.json'));print('stocks',d.get('count'),'as_of',d.get('as_of'))"

      - name: Push snapshot to Autopilot-data
        if: hashFiles('data-repo/.git/config') != ''
        working-directory: data-repo
        run: |
          mkdir -p snapshots
          cp /tmp/watchlist_latest.json snapshots/watchlist_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/watchlist_latest.json
          if git diff --staged --quiet; then
            echo "No data-repo changes"
          else
            git commit -m "snapshot: watchlist_latest $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Commit snapshot into frontend (same-origin fallback)
        working-directory: app
        run: |
          mkdir -p frontend/snapshots
          cp /tmp/watchlist_latest.json frontend/snapshots/watchlist_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/snapshots/watchlist_latest.json
          if git diff --staged --quiet; then
            echo "No app snapshot changes"
          else
            git commit -m "snapshot: frontend watchlist_latest $(date -u +%Y-%m-%d)"
            git push
          fi
