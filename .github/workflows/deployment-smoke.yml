name: Deployment smoke diagnostics

on:
  push:
    branches:
      - main
      - diagnostics/deployment-smoke-tests
    paths:
      - "tests/test_deployment_smoke.py"
      - "tests/test_user_scenarios_live.py"
      - ".github/workflows/deployment-smoke.yml"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests
      - name: Test live backend, CORS, frontend, and user scenarios
        run: |
          mkdir -p test-results
          python -m pytest tests/test_deployment_smoke.py tests/test_user_scenarios_live.py -q -ra --junitxml=test-results/live-diagnostics.xml
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-live-diagnostics-${{ github.run_number }}
          path: test-results/live-diagnostics.xml
          if-no-files-found: warn
