name: Deployment smoke diagnostics

on:
  push:
    branches:
      - main
      - diagnostics/deployment-smoke-tests
    paths:
      - "tests/test_deployment_smoke.py"
      - ".github/workflows/deployment-smoke.yml"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests
      - name: Test live backend, CORS, and frontend
        run: python -m pytest tests/test_deployment_smoke.py -q -ra
